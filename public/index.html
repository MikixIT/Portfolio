<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%PUBLIC_URL%/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="%PUBLIC_URL%/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="%PUBLIC_URL%/apple-touch-icon.png"
    />
    <link rel="manifest" href="%PUBLIC_URL%/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Michael Torres Dev Portfolio" />
    
    <!-- Preload and optimize font loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Anton&display=swap" as="style">
    <link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
    
    <!-- Prevent FOUC by initializing dark mode before React -->
    <script>
      (function() {
        const saved = localStorage.getItem("darkMode");
        const isDarkMode = saved === null ? true : saved === "true";
        if (isDarkMode) {
          document.documentElement.classList.add("dark-mode");
          document.documentElement.style.setProperty('--body_bg', '#111');
          document.documentElement.style.setProperty('--body_color', 'rgba(255, 255, 255, 0.967)');
          document.documentElement.style.setProperty('--link_color', 'rgb(255, 220, 220)');
        } else {
          document.documentElement.classList.add("light-mode");
          document.documentElement.style.setProperty('--body_bg', '#ffffff');
          document.documentElement.style.setProperty('--body_color', '#111');
          document.documentElement.style.setProperty('--link_color', 'grey');
        }
        document.documentElement.style.background = 'var(--body_bg)';
        document.documentElement.style.color = 'var(--body_color)';
      })();
    </script>
    
    <style>
      /* Immediate styles to prevent flash */
      html, body {
        background: var(--body_bg) !important;
        color: var(--body_color) !important;
        font-family: 'Anton', sans-serif !important;
        margin: 0;
        padding: 0;
      }
      
      /* Font display optimization */
      @font-face {
        font-family: 'Anton';
        font-display: swap;
      }
    </style>
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>MTDEV - Portofolio</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    <script>
      if (window.location.hostname === "www.michaeltorresdev.dev") {
        window.location.href = "https://michaeltorresdev.dev";
      }
    </script>
  </body>
</html>
